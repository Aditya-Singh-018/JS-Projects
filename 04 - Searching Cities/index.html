<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Searching Cities 👀</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <form class="search-form">
    <input type="text" class="search" placeholder="City or State">
    <ul class="suggestions">
      <li>Filter for a city</li>
      <li>or a state</li>
    </ul>
  </form>
<script>
  const endpoint = 'https://gist.githubusercontent.com/Miserlou/c5cd8364bf9b2420bb29/raw/2bf258763cdddd704f8ffd3ea9a3e81d25e2c6f6/cities.json';
  const cities = [];
  const data = fetch(endpoint)
    .then((res)=>{
      console.log(res);
      res.json()
      .then((data)=>{
        cities.push(...data);
        console.log(cities);
      });
    }
  );

  function findCities(matchCity,cities){
    return cities.filter(place =>{
      const regex = new RegExp(matchCity,"gi");
      return place.city.match(regex) || place.city.match(regex);
    });
  }

  function displayMatches(){
    const matchArray = findCities(this.value,cities);
    console.log(matchArray);
    
    const html = matchArray.map(place=>{
      const regex = new RegExp(this.value,'gi');
      const cityName = place.city.replace(regex,`<span class="hl">${this.value}</span>`);
      const stateName = place.city.replace(regex,`<span class="hl">${this.value}</span>`);

      return `
        <li>
          <span class= "name">${cityName},${stateName}</span>
          <span class= "population">${place.population}</span>
        <li>  
      `
    }).join('');
    suggestions.innerHTML = html;
  }

  let searchInput = document.querySelector('.search');
  let suggestions = document.querySelector('.suggestions');

  searchInput.addEventListener('change',displayMatches);
  searchInput.addEventListener('keyup',displayMatches);

  console.log(findCities("Bos",cities));

  
    

</script>
</body>
</html>
